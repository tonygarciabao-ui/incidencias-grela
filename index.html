<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidencias Pendientes</title>
    <style>
        body { background: #1a1a1a; color: #fff; font-family: Arial; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #ef4444; }
        h2 { margin-top: 30px; }
        .card { background: #2d2d2d; padding: 20px; margin: 10px 0; border-left: 4px solid #ef4444; }
        .card.alta { border-left-color: #ef4444; }
        .card.media { border-left-color: #f59e0b; }
        .card.baja { border-left-color: #10b981; }
        .loading { text-align: center; padding: 40px; }
        .error { color: #fca5a5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚠️ PENDIENTES - A Grela</h1>
        <div id="content">
            <div class="loading">
                <p>Cargando incidencias...</p>
            </div>
        </div>
    </div>
    <script>
        const JSON_URL = 'https://default4c49bed785da470cafc37735b371a3.43.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/24/workflows/f62cce79b444494aad955507360db643/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=VSWqnfDZqHEbg9rOCYfYYKl3DPhroUBpsK0QDDIWcQA';
        
        async function loadData() {
            try {
                const response = await fetch(JSON_URL);
                const data = await response.json();
                
                const pendientes = data.datos.filter(item => 
                    String(item['ESTADO REPARACION'] || '').toLowerCase() === 'pendiente'
                );
                
                let html = '<h2>Total: ' + pendientes.length + ' pendientes</h2>';
                
                pendientes.forEach(item => {
                    const prioridad = String(item.PRIORIDAD || '').toLowerCase();
                    html += `
                        <div class="card ${prioridad}">
                            <strong>${item.CARRETILLA}</strong> - ${item.INCIDENCIA}
                            <br><small>Usuario: ${item.USUARIO} | Prioridad: ${item.PRIORIDAD} | Responsable: ${item['JJEE / AUX. DESC.']}</small>
                        </div>
                    `;
                });
                
                document.getElementById('content').innerHTML = html;
            } catch (error) {
                document.getElementById('content').innerHTML = '<p class="error">Error al cargar: ' + error.message + '</p>';
            }
        }
        
        loadData();
    </script>
</body>
</html>
