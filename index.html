<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incidencias Pendientes - A Grela</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 36px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .location {
            font-size: 14px;
            color: #888;
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 8px;
            text-align: center;
            min-width: 120px;
        }

        .stat-number {
            font-size: 28px;
            font-weight: 700;
            color: #ef4444;
            display: block;
        }

        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 16px;
            border-radius: 8px;
            color: #fff;
            font-family: 'DM Sans', sans-serif;
        }

        .search-box::placeholder {
            color: #666;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: rgba(239, 68, 68, 0.2);
            border-color: #ef4444;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.02);
            border-left: 4px solid #ef4444;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
            overflow: hidden;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-5px);
        }

        .card.alta { border-left-color: #ef4444; }
        .card.media { border-left-color: #f59e0b; }
        .card.baja { border-left-color: #10b981; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .carretilla {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #fbbf24;
            text-transform: uppercase;
        }

        .priority-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .priority-badge.alta {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid #dc2626;
        }

        .priority-badge.media {
            background: rgba(245, 158, 11, 0.2);
            color: #fcd34d;
            border: 1px solid #b45309;
        }

        .priority-badge.baja {
            background: rgba(16, 185, 129, 0.2);
            color: #86efac;
            border: 1px solid #059669;
        }

        .card-title {
            font-weight: 600;
            font-size: 16px;
            margin-bottom: 10px;
            color: #fff;
            line-height: 1.4;
        }

        .card-info {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 15px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .info-icon {
            width: 16px;
            height: 16px;
            background: rgba(239, 68, 68, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 12px;
            color: #888;
        }

        .responsable {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .avatar {
            width: 24px;
            height: 24px;
            background: rgba(239, 68, 68, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #fca5a5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(239, 68, 68, 0.2);
            border-top-color: #ef4444;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .sync-info {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: 20px;
        }

        .sync-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            margin-right: 5px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 28px;
            }

            .stats {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-title">
                <div class="logo">⚠️</div>
                <div>
                    <h1>Pendientes</h1>
                    <div class="location">Incidencias en reparación • A Grela</div>
                </div>
            </div>
            <div class="stats" id="stats"></div>
        </header>

        <div class="controls">
            <input 
                type="text" 
                class="search-box" 
                id="searchInput" 
                placeholder="Buscar carretilla, usuario o incidencia..."
            >
            <button class="filter-btn active" data-filter="todas">Todas</button>
            <button class="filter-btn" data-filter="alta">Urgentes</button>
            <button class="filter-btn" data-filter="media">Media</button>
            <button class="filter-btn" data-filter="baja">Baja</button>
        </div>

        <div id="content">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Cargando incidencias...</p>
            </div>
        </div>

        <div class="sync-info" id="syncInfo"></div>
    </div>

    <script>
        const JSON_URL = 'https://estrellaga15002637.sharepoint.com/sites/EXPEDICIONES/_layouts/15/download.aspx?UniqueId=652cc8ec5ce9420896046f1f81de7e2e&e=O8UdjS';
        let allData = [];
        let currentFilter = 'todas';

        async function loadData() {
            try {
                const response = await fetch(JSON_URL);
                const data = await response.json();
                
                allData = data.datos ? data.datos.filter(item => {
                    const estado = String(item['ESTADO REPARACION'] || '').toLowerCase().trim();
                    return estado === 'pendiente';
                }) : [];

                renderStats();
                renderCards(allData);
                updateSyncInfo();
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">❌</div>
                        <p>Error al cargar datos</p>
                        <p style="font-size: 12px; margin-top: 10px;">${error.message}</p>
                    </div>
                `;
            }
        }

        function renderStats() {
            const total = allData.length;
            const urgentes = allData.filter(d => String(d.PRIORIDAD || '').toLowerCase() === 'alta').length;
            
            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <span class="stat-number">${total}</span>
                    <span class="stat-label">Pendientes</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" style="color: #ef4444;">${urgentes}</span>
                    <span class="stat-label">Urgentes</span>
                </div>
            `;
        }

        function renderCards(data) {
            if (data.length === 0) {
                document.getElementById('content').innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">✅</div>
                        <p>¡Sin incidencias pendientes!</p>
                    </div>
                `;
                return;
            }

            const cards = data.map(item => {
                const prioridad = String(item.PRIORIDAD || '').toLowerCase();
                const initials = (item['JJEE / AUX. DESC.'] || '?').split(' ').map(w => w[0]).join('').substring(0, 2);
                
                return `
                    <div class="card ${prioridad}">
                        <div class="card-header">
                            <div class="carretilla">${item.CARRETILLA || 'N/A'}</div>
                            <span class="priority-badge ${prioridad}">${prioridad || 'N/A'}</span>
                        </div>
                        <div class="card-title">${item.INCIDENCIA || 'Sin descripción'}</div>
                        <div class="card-info">
                            <div class="info-item">
                                <div class="info-icon">📅</div>
                                <span>${formatDate(item['FECHA AVERIA'])}</span>
                            </div>
                            <div class="info-item">
                                <div class="info-icon">👤</div>
                                <span>${item.USUARIO || 'N/A'}</span>
                            </div>
                        </div>
                        <div class="card-footer">
                            <div class="responsable">
                                <div class="avatar">${initials}</div>
                                <span>${item['JJEE / AUX. DESC.'] || 'No asignado'}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('content').innerHTML = `<div class="grid">${cards}</div>`;
        }

        function formatDate(date) {
            if (!date) return 'N/A';
            try {
                const d = new Date(date);
                return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
            } catch {
                return date;
            }
        }

        function updateSyncInfo() {
            const now = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('syncInfo').innerHTML = `
                <span class="sync-indicator"></span>
                Última actualización: ${now}
            `;
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const search = e.target.value.toLowerCase();
            const filtered = allData.filter(item => {
                const carretilla = String(item.CARRETILLA || '').toLowerCase();
                const usuario = String(item.USUARIO || '').toLowerCase();
                const incidencia = String(item.INCIDENCIA || '').toLowerCase();
                return carretilla.includes(search) || usuario.includes(search) || incidencia.includes(search);
            });
            
            const byFilter = currentFilter === 'todas' 
                ? filtered 
                : filtered.filter(d => String(d.PRIORIDAD || '').toLowerCase() === currentFilter);
            
            renderCards(byFilter);
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                
                const search = document.getElementById('searchInput').value.toLowerCase();
                let filtered = currentFilter === 'todas' 
                    ? allData 
                    : allData.filter(d => String(d.PRIORIDAD || '').toLowerCase() === currentFilter);
                
                if (search) {
                    filtered = filtered.filter(item => {
                        const carretilla = String(item.CARRETILLA || '').toLowerCase();
                        const usuario = String(item.USUARIO || '').toLowerCase();
                        const incidencia = String(item.INCIDENCIA || '').toLowerCase();
                        return carretilla.includes(search) || usuario.includes(search) || incidencia.includes(search);
                    });
                }
                
                renderCards(filtered);
            });
        });

        loadData();
        setInterval(loadData, 60000);
    </script>
</body>
</html>
